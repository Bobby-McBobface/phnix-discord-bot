[tool.poetry]
name = "Phnix Discord Bot"
version = "2.0.0dev1"
description = "A Discord bot that does stuff."
authors = ["Bobby-McBobface <54757965+Bobby-McBobface@users.noreply.github.com>"]
license = "AGPL-3.0-or-later"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
"discord.py" = {version="^2.7.1", extras = ["speed"]}
aiodns = "<4"
aiosqlite = "^0.22.1"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pylint = "^4.0.5"
black = "^26.5.0"
isort = "^8.0.1"
pre-commit = "^4.6.0"
pyright = "^1.1.409"

[tool.pylint.format]
max-line-length = "88"
good-names = "i,j,k,ex,Run,_,xp"
max-args = 10

[tool.isort]
profile = "black"

[tool.pyright]
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
